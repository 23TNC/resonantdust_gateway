[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
# Client<->gate protocol framing + relaying shard rows/reducers as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sats->serde bridge: serialize generated shard row types (sats Serialize, not
# serde) to JSON for the client.
spacetimedb-sats = "2.3"
# Relay client reducer calls to shard's HTTP /call endpoint (http-only), and
# fetch the content corpus from an authority peer (http) or an R2 bucket (https).
# rustls-tls is the self-contained TLS backend (no system openssl in the image).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# S3-compatible writes (R2/MinIO) for runtime content authoring — hand-rolled
# SigV4 over reqwest+rustls, so no aws-sdk (its aws-lc-sys needs a C toolchain the
# rust:slim build image lacks). These are pure-Rust and tiny.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Upstream client to the SpacetimeDB shards. Must match the generator that
# produced src/bindings/ (spacetime cli 2.3.0).
spacetimedb-sdk = "2.3"
# Shared logic rlibs (codec/bit-fields, DSL VM, state/stack, wire protocol),
# bind-mounted at /workspace/shared by the compose `build` service (they live in
# the main repo's shared/ workspace). The gate links them directly; the client
# gets them built to wasm.
resonantdust-codec = { path = "shared/codec" }
resonantdust-dsl = { path = "shared/dsl" }
resonantdust-state = { path = "shared/state" }
resonantdust-protocol = { path = "shared/protocol" }
# Recipe glue (run a recipe → ActionPlan over a CardStore) — moved out of the
# gate into shared so the client reuses it. The gate's Snapshot impls CardStore.
resonantdust-rules = { path = "shared/rules" }
